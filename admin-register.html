<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Daftar Admin • RevanStore</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f4fcff,#e7f9ff 48%,#fff);color:#123047;display:grid;place-items:center;padding:20px}.box{width:min(470px,100%);background:#fff;border:1px solid #d6eef7;border-radius:26px;padding:30px;box-shadow:0 25px 70px rgba(0,150,200,.14)}.logo{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,#00bfff,#39d6ff);color:#fff;font-size:24px;font-weight:900;box-shadow:0 12px 30px rgba(0,191,255,.25);margin-bottom:18px}.box h1{margin:0 0 7px;font-size:25px}.box p{margin:0 0 22px;color:#688398;font-size:13px;line-height:1.6}.field{margin-top:13px}.field label{display:block;font-size:12px;font-weight:700;color:#55758a;margin-bottom:6px}.input{width:100%;padding:12px 13px;border:1px solid #cfe8f2;border-radius:12px;background:#fff;outline:none;color:#17384c}.input:focus{border-color:#00bfff;box-shadow:0 0 0 4px rgba(0,191,255,.12)}button{width:100%;margin-top:18px;border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,#00bfff,#08a9e7);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 9px 22px rgba(0,191,255,.2)}button:disabled{opacity:.6;cursor:not-allowed}.msg{min-height:20px;margin-top:12px;text-align:center;font-size:12px;color:#e33f61}.back{display:block;text-align:center;margin-top:15px;color:#00a8df;text-decoration:none;font-weight:700;font-size:13px}.hint{margin-top:16px;padding:11px 13px;border-radius:12px;background:#f1fbff;color:#568095;font-size:11px;line-height:1.5}
</style></head><body><main class="box"><div class="logo">R</div><h1>Daftar Panel Admin</h1><p>Buat akun admin untuk mengakses RevanStore Admin Panel.</p><form id="form"><div class="field"><label>Username Admin</label><input id="username" class="input" required minlength="3" autocomplete="username"></div><div class="field"><label>Email Admin</label><input id="email" class="input" type="email" required autocomplete="email" placeholder="admin@email.com"></div><div class="field"><label>Password</label><input id="password" class="input" type="password" required minlength="8" autocomplete="new-password"></div><div class="field"><label>Konfirmasi Password</label><input id="confirmPassword" class="input" type="password" required minlength="8" autocomplete="new-password"></div><button id="btn" type="submit">Daftar Admin</button></form><div id="msg" class="msg"></div><div class="hint">Password minimal 8 karakter dan wajib mengandung huruf besar, huruf kecil, dan angka.</div><a class="back" href="/admin">← Kembali ke Login Admin</a></main>
<script>
const $=id=>document.getElementById(id);const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const ub=s=>{s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};let serverKey,keys;
async function init(){const r=await fetch('/api/admin?action=key',{cache:'no-store'});if(!r.ok)throw Error('Public key gagal diambil');const j=await r.json();serverKey=await crypto.subtle.importKey('jwk',j.publicKey,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);keys=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt'])}
async function request(payload){if(!keys)await init();const aes=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));const enc=new TextEncoder();const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},aes,enc.encode(JSON.stringify(payload))));const raw=await crypto.subtle.exportKey('raw',aes);const wrapped=await crypto.subtle.encrypt({name:'RSA-OAEP'},serverKey,raw);const pub=await crypto.subtle.exportKey('jwk',keys.publicKey);const body={v:1,alg:'RSA-OAEP-256/AES-256-GCM',key:b64(wrapped),iv:b64(iv),tag:b64(c.slice(-16)),data:b64(c.slice(0,-16))};const r=await fetch('/api/admin?action=register',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-Fingerprint':location.host},body:JSON.stringify({envelope:body,clientPublicKey:pub})});const j=await r.json();if(!j.encrypted)return j;const k=await crypto.subtle.decrypt({name:'RSA-OAEP'},keys.privateKey,ub(j.data.key));const ak=await crypto.subtle.importKey('raw',k,{name:'AES-GCM'},false,['decrypt']);const all=new Uint8Array([...ub(j.data.data),...ub(j.data.tag)]);const out=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(j.data.iv)},ak,all);return JSON.parse(new TextDecoder().decode(out))}
$('form').onsubmit=async e=>{e.preventDefault();$('btn').disabled=true;$('msg').textContent='Memproses...';try{const r=await request({username:$('username').value.trim(),email:$('email').value.trim(),password:$('password').value,confirmPassword:$('confirmPassword').value});if(r.success){$('msg').style.color='#16a673';$('msg').textContent=r.message||'Admin berhasil didaftarkan.';setTimeout(()=>location.href='/admin',1200)}else throw Error(r.message||'Pendaftaran gagal')}catch(e){$('msg').style.color='#e33f61';$('msg').textContent=e.message||'Pendaftaran gagal'}finally{$('btn').disabled=false}};
</script></body></html>
