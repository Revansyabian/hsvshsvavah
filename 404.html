<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' https:; frame-src https://www.google.com/recaptcha/; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>404 - Ga Ketemu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1a1a2e;
        }

        .box {
            text-align: center;
            max-width: 420px;
            padding: 40px 28px;
        }

        h1 {
            font-size: 72px;
            font-weight: 700;
            color: #00bfff;
            letter-spacing: -2px;
            margin-bottom: 8px;
        }

        p {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 32px;
        }

        a {
            display: inline-block;
            padding: 10px 24px;
            background: #00bfff;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }

        a:hover {
            background: #0099cc;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>404</h1>
        <p>Halaman yang kamu cari ga ada.</p>
        <a href="/">Kembali</a>
    </div>
</body>
</html>
