<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' https:; frame-src https://www.google.com/recaptcha/; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests;">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Login - Top Up</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<meta name="theme-color" content="#00BFFF">
<style>
  :root {
    --bg: #f4f7fb;
    --surface: #FFFFFF;
    --ink: #0F172A;
    --ink-2: #1E293B;
    --muted: #64748b;
    --muted-2: #94a3b8;
    --border: #0F172A;

    --sky: #00BFFF;
    --sky-dark: #0095CC;
    --sky-soft: #E0F5FF;
    --sky-focus: #F0FAFF;

    --amber: #f59e0b;
    --coral: #ef4444;

    --radius: 12px;
    --radius-sm: 10px;

    --shadow: 5px 5px 0 var(--border);
    --shadow-sm: 3px 3px 0 var(--border);
    --shadow-xs: 2px 2px 0 var(--border);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }

  .login-container { width: 100%; max-width: 440px; }

  .login-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 36px 32px 32px;
    box-shadow: var(--shadow);
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ─── Header ──────────────────────────────────── */
  .login-header { margin-bottom: 28px; }

  .brand-line {
    display: inline-flex;
    align-items: center;
    padding: 7px 18px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow-xs);
    margin-bottom: 22px;
  }

  .brand-text {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .login-header h1 {
    color: var(--ink);
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }

  .login-header p {
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    margin-top: 6px;
  }

  /* ─── Form ────────────────────────────────────── */
  .form-group { margin-bottom: 20px; }

  .form-group label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    color: var(--ink);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .form-group label i { color: var(--amber); font-size: 13px; }

  .password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
  }

  .form-input {
    width: 100%;
    padding: 13px 16px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--ink-2);
    font-size: 15px;
    font-weight: 500;
    transition: transform 100ms ease, box-shadow 100ms ease, border-color 150ms ease, background-color 150ms ease;
    padding-right: 48px;
    outline: none;
    box-shadow: var(--shadow-xs);
  }

  .form-input::placeholder { color: var(--muted-2); font-weight: 500; }

  .form-input:hover {
    transform: translate(-1px, -1px);
    box-shadow: var(--shadow-sm);
  }

  .form-input:focus {
    transform: translate(-2px, -2px);
    box-shadow: var(--shadow-sm);
    border-color: var(--sky);
    background: var(--sky-focus);
  }

  #togglePassword {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: var(--muted-2);
    font-size: 17px;
    transition: color 150ms;
    z-index: 2;
  }

  #togglePassword:hover { color: var(--sky); }

  .password-counter {
    text-align: right;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted-2);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .login-footer {
    margin: 16px 0 20px;
    padding: 12px 16px;
    background: var(--sky-soft);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-xs);
    text-align: center;
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .login-footer i { color: var(--sky-dark); font-size: 14px; }

  .recaptcha-wrapper { margin: 0 0 20px; display: flex; justify-content: center; }

  .btn {
    padding: 14px 24px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 100ms ease, box-shadow 100ms ease, background-color 150ms ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #fff;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    width: 100%;
  }

  .btn-primary {
    background: var(--sky);
    box-shadow: var(--shadow-sm);
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--sky-dark);
    transform: translate(-2px, -2px);
    box-shadow: var(--shadow);
  }

  .btn-primary:active:not(:disabled) {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--border);
  }

  .btn-primary:focus-visible {
    outline: 2px solid var(--sky);
    outline-offset: 2px;
  }

  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .login-links {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    font-size: 13px;
    flex-wrap: wrap;
  }

  .login-links a {
    text-decoration: none;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: color 150ms;
    color: var(--sky-dark);
  }

  .login-links a:hover {
    color: var(--sky);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .login-links a.link-warning { color: var(--coral); }
  .login-links a.link-warning:hover { color: #dc2626; }

  #loadingOverlay {
    background: rgba(15, 23, 42, 0.7) !important;
    backdrop-filter: blur(3px);
  }

  #loadingOverlay > div {
    background: var(--surface) !important;
    border: 2px solid var(--border);
    border-radius: var(--radius) !important;
    box-shadow: var(--shadow);
    color: var(--ink) !important;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--sky-soft);
    border-top: 3px solid var(--sky);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto;
  }

  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  #loadingMessage { color: var(--ink) !important; }

  @media (max-width: 480px) {
    .login-card { padding: 28px 22px 24px; }
    .login-header h1 { font-size: 24px; }
  }
</style>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

<div id="loadingOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;justify-content:center;align-items:center;padding:20px;">
    <div style="padding:32px 40px;text-align:center;">
        <div class="spinner"></div>
        <p id="loadingMessage" style="margin-top:15px;font-size:13px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;">Memproses...</p>
    </div>
</div>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="brand-line">
                <span class="brand-text">Top Up</span>
            </div>
            <h1>Selamat datang</h1>
            <p>Masuk untuk melanjutkan</p>
        </div>

        <div class="form-group">
            <label for="username"><i class="fas fa-user"></i> Username</label>
            <input type="text" id="username" placeholder="Masukkan username" class="form-input" autocomplete="username">
        </div>

        <div class="form-group" style="margin-bottom:0;">
            <label for="password"><i class="fas fa-lock"></i> Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Masukkan password" class="form-input" maxlength="20" autocomplete="current-password">
                <i id="togglePassword" class="fas fa-eye-slash" aria-label="Tampilkan password"></i>
            </div>
            <div class="password-counter"><span id="passwordCharCount">0/20</span></div>
        </div>

        <div class="login-footer">
            <i class="fas fa-info-circle"></i>
            <span>Register dulu jika belum punya akun</span>
        </div>

        <div class="recaptcha-wrapper">
            <div class="g-recaptcha" data-sitekey="6LeffrotAAAAAO7SRbl-wJQ8YXzOGNG-t-DW5EGT"></div>
        </div>

        <button class="btn btn-primary" id="btnLogin" onclick="login()">
            <i class="fas fa-sign-in-alt"></i> Login
        </button>

        <div class="login-links">
            <a href="/pages/reset-password" class="link-warning"><i class="fas fa-key"></i> Lupa Password?</a>
            <a href="/pages/register"><i class="fas fa-user-plus"></i> Register</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/pages/login.js"></script>
</body>
</html>
