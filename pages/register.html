<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' https:; frame-src https://www.google.com/recaptcha/; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Daftar - Top Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#00BFFF">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
    <style>
        :root {
            --bg:#f4f7fb;--surface:#FFFFFF;--ink:#0F172A;--ink-2:#1E293B;
            --muted:#64748b;--muted-2:#94a3b8;--border:#0F172A;
            --sky:#00BFFF;--sky-dark:#0095CC;--sky-soft:#E0F5FF;--sky-focus:#F0FAFF;
            --amber:#f59e0b;--coral:#ef4444;--green:#10b981;
            --radius:12px;--radius-sm:10px;
            --shadow:5px 5px 0 var(--border);--shadow-sm:3px 3px 0 var(--border);--shadow-xs:2px 2px 0 var(--border);
        }
        * { margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',Tahoma,sans-serif; }
        body { background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased; }
        .register-container { width:100%;max-width:480px; }
        .register-card { background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:36px 32px 32px;box-shadow:var(--shadow);animation:fadeIn 0.4s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);} }
        .register-header { margin-bottom:24px; }
        .register-header h1 { color:var(--ink);font-size:26px;font-weight:900;letter-spacing:-0.03em;line-height:1.15; }
        .register-header p { color:var(--muted);font-size:14px;font-weight:500;margin-top:6px; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--ink);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em; }
        .form-group label i { color:var(--amber);font-size:13px; }
        .form-input { width:100%;padding:13px 16px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-sm);color:var(--ink-2);font-size:15px;font-weight:500;transition:transform 100ms,box-shadow 100ms,border-color 150ms,background-color 150ms;outline:none;box-shadow:var(--shadow-xs); }
        .form-input::placeholder { color:var(--muted-2);font-weight:500; }
        .form-input:hover { transform:translate(-1px,-1px);box-shadow:var(--shadow-sm); }
        .form-input:focus { transform:translate(-2px,-2px);box-shadow:var(--shadow-sm);border-color:var(--sky);background:var(--sky-focus); }
        .btn { padding:14px 24px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-weight:800;cursor:pointer;transition:transform 100ms,box-shadow 100ms,background-color 150ms;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;letter-spacing:0.06em;text-transform:uppercase;width:100%; }
        .btn-primary { background:var(--sky);box-shadow:var(--shadow-sm); }
        .btn-primary:hover:not(:disabled) { background:var(--sky-dark);transform:translate(-2px,-2px);box-shadow:var(--shadow); }
        .btn-primary:active:not(:disabled) { transform:translate(2px,2px);box-shadow:1px 1px 0 var(--border); }
        .btn:disabled { opacity:0.6;cursor:not-allowed; }
        .recaptcha-wrapper { margin-bottom:16px;display:flex;justify-content:center; }
        .verification-box { display:flex;align-items:flex-start;gap:10px;padding:14px;background:var(--sky-soft);border:2px solid var(--border);border-radius:var(--radius-sm);margin-bottom:16px;box-shadow:var(--shadow-xs); }
        .verification-box input[type="checkbox"] { width:18px;height:18px;margin-top:2px;accent-color:var(--sky);cursor:pointer;flex-shrink:0; }
        .verification-box label { font-size:12px;color:var(--ink);cursor:pointer;line-height:1.5;font-weight:600; }
        .error-message { background:#fee2e2;color:#991b1b;border:2px solid var(--border);padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;margin-bottom:16px;display:none;box-shadow:var(--shadow-xs); }
        .error-message.show { display:block; }
        .password-strength { height:6px;border-radius:3px;margin-top:6px;background:var(--sky-soft);overflow:hidden;border:2px solid var(--border); }
        .password-strength-bar { height:100%;width:0%;transition:all 0.3s ease;border-radius:2px; }
        .strength-weak { background:var(--coral);width:33%; }
        .strength-medium { background:var(--amber);width:66%; }
        .strength-strong { background:var(--green);width:100%; }
        .paket-dropdown { position:relative; }
        .paket-select { width:100%;padding:13px 16px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-sm);color:var(--ink-2);font-size:15px;font-weight:500;cursor:pointer;transition:transform 100ms,box-shadow 100ms;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-xs); }
        .paket-select:hover { transform:translate(-1px,-1px);box-shadow:var(--shadow-sm); }
        .paket-select.active { transform:translate(-2px,-2px);box-shadow:var(--shadow-sm);border-color:var(--sky);background:var(--sky-focus); }
        .paket-select .placeholder { color:var(--muted-2); }
        .paket-select .selected-text { color:var(--ink);font-weight:700; }
        .paket-select i { color:var(--sky);transition:transform 0.2s ease; }
        .paket-select.active i { transform:rotate(180deg); }
        .paket-list { position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-sm);max-height:280px;overflow-y:auto;z-index:10;display:none;box-shadow:var(--shadow); }
        .paket-list.show { display:block; }
        .paket-option { padding:12px 16px;cursor:pointer;transition:background 0.15s;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--sky-soft); }
        .paket-option:last-child { border-bottom:none; }
        .paket-option:hover { background:var(--sky-focus); }
        .paket-option.selected { background:var(--sky-soft); }
        .paket-option .paket-name { font-size:13px;font-weight:800;color:var(--ink); }
        .paket-option .paket-price { font-size:14px;font-weight:900;color:var(--sky-dark); }
        .honeypot-field { position:absolute;left:-9999px;opacity:0;height:0;width:0;overflow:hidden; }
        .register-footer { margin-top:20px;text-align:center;color:var(--muted);font-size:13px;font-weight:500;padding-top:16px;border-top:2px dashed var(--border); }
        .register-footer a { color:var(--sky-dark);text-decoration:none;font-weight:700; }
        .register-footer a:hover { text-decoration:underline;text-underline-offset:3px; }
        @media(max-width:480px) { .register-card{padding:28px 22px;} .register-header h1{font-size:22px;} }
    </style>
    <script src="/pages/secure-api.js"></script>
</head>
<body>

    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <h1>Daftar Akun</h1>
                <p>Pilih paket dan buat akun baru</p>
            </div>

            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
            </div>

            <div class="honeypot-field" aria-hidden="true">
                <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" placeholder="Huruf dan angka (3-20)" class="form-input" maxlength="20" oninput="validateUsernameInput()">
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="Minimal 6 karakter" class="form-input" maxlength="20" oninput="updatePasswordStrength()">
                <div class="password-strength"><div class="password-strength-bar" id="passwordStrengthBar"></div></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword"><i class="fas fa-lock"></i> Konfirmasi Password</label>
                <input type="password" id="confirmPassword" placeholder="Ulangi password" class="form-input" maxlength="20" oninput="updateConfirmPasswordStrength()">
                <div class="password-strength"><div class="password-strength-bar" id="confirmPasswordStrengthBar"></div></div>
            </div>

            <div class="form-group">
                <label for="phone"><i class="fas fa-phone"></i> Nomor Telepon</label>
                <input type="tel" id="phone" placeholder="081234567890" class="form-input" maxlength="15" oninput="validatePhoneInput()">
            </div>

            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" placeholder="nama@email.com" class="form-input" maxlength="50" oninput="validateEmailInput()">
            </div>

            <div class="form-group">
                <label><i class="fas fa-box"></i> Pilih Paket</label>
                <div class="paket-dropdown" id="paketDropdown">
                    <div class="paket-select" id="paketSelect" onclick="togglePaketList()">
                        <span class="placeholder" id="paketPlaceholder">Klik untuk pilih paket...</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="paket-list" id="paketList">
                        <div class="paket-option" data-paket="1 Minggu" data-harga="15000" onclick="selectPaketOption(this)">
                            <span class="paket-name">1 Minggu</span><span class="paket-price">Rp 15.000</span>
                        </div>
                        <div class="paket-option" data-paket="2 Minggu" data-harga="25000" onclick="selectPaketOption(this)">
                            <span class="paket-name">2 Minggu</span><span class="paket-price">Rp 25.000</span>
                        </div>
                        <div class="paket-option" data-paket="1 Bulan" data-harga="40000" onclick="selectPaketOption(this)">
                            <span class="paket-name">1 Bulan</span><span class="paket-price">Rp 40.000</span>
                        </div>
                        <div class="paket-option" data-paket="2 Bulan" data-harga="50000" onclick="selectPaketOption(this)">
                            <span class="paket-name">2 Bulan</span><span class="paket-price">Rp 50.000</span>
                        </div>
                        <div class="paket-option" data-paket="3 Bulan" data-harga="55000" onclick="selectPaketOption(this)">
                            <span class="paket-name">3 Bulan</span><span class="paket-price">Rp 55.000</span>
                        </div>
                        <div class="paket-option" data-paket="Permanen" data-harga="100000" onclick="selectPaketOption(this)">
                            <span class="paket-name">Permanen</span><span class="paket-price">Rp 100.000</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="verification-box">
                <input type="checkbox" id="verificationCheck" onchange="toggleSubmitButton()">
                <label for="verificationCheck">Saya menyetujui bahwa akun saya perlu <b>diaktivasi oleh admin</b> terlebih dahulu sebelum bisa digunakan.</label>
            </div>

            <div class="recaptcha-wrapper">
                <div class="g-recaptcha" data-sitekey="6LeffrotAAAAAO7SRbl-wJQ8YXzOGNG-t-DW5EGT"></div>
            </div>

            <button class="btn btn-primary" id="btnRegister" onclick="register()" disabled>
                <i class="fas fa-user-plus"></i> Daftar
            </button>

            <div class="register-footer">
                <p>Sudah punya akun? <a href="/">Login di sini</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/pages/register.js"></script>
</body>
</html>
