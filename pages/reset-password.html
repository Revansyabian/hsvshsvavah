<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' https:; frame-src https://www.google.com/recaptcha/; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Reset Password - Top Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#00BFFF">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        :root{--bg:#f4f7fb;--surface:#FFFFFF;--ink:#0F172A;--ink-2:#1E293B;--muted:#64748b;--muted-2:#94a3b8;--border:#0F172A;--sky:#00BFFF;--sky-dark:#0095CC;--sky-soft:#E0F5FF;--sky-focus:#F0FAFF;--amber:#f59e0b;--coral:#ef4444;--green:#10b981;--radius:12px;--radius-sm:10px;--shadow:5px 5px 0 var(--border);--shadow-sm:3px 3px 0 var(--border);--shadow-xs:2px 2px 0 var(--border);}
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',Tahoma,sans-serif;}
        body{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased;}
        .reset-container{width:100%;max-width:440px;}
        .reset-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:36px 32px 32px;box-shadow:var(--shadow);animation:fadeIn 0.4s ease;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
        .reset-header{margin-bottom:24px;}
        .reset-header h1{color:var(--ink);font-size:26px;font-weight:900;letter-spacing:-0.03em;}
        .reset-header p{color:var(--muted);font-size:14px;font-weight:500;margin-top:6px;}
        .reset-footer{margin-top:24px;text-align:center;color:var(--muted);font-size:13px;font-weight:500;padding-top:18px;border-top:2px dashed var(--border);}
        .reset-footer a{color:var(--sky-dark);text-decoration:none;font-weight:700;}
        .reset-footer a:hover{text-decoration:underline;text-underline-offset:3px;}
        .form-group{margin-bottom:16px;}
        .form-group label{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--ink);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;}
        .form-group label i{color:var(--amber);width:16px;font-size:13px;}
        .form-input{width:100%;padding:13px 16px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-sm);color:var(--ink-2);font-size:15px;font-weight:500;transition:transform 100ms,box-shadow 100ms,border-color 150ms,background-color 150ms;outline:none;box-shadow:var(--shadow-xs);}
        .form-input::placeholder{color:var(--muted-2);font-weight:500;}
        .form-input:hover{transform:translate(-1px,-1px);box-shadow:var(--shadow-sm);}
        .form-input:focus{transform:translate(-2px,-2px);box-shadow:var(--shadow-sm);border-color:var(--sky);background:var(--sky-focus);}
        .form-input.error{border-color:var(--coral);}
        .btn{padding:14px 24px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-weight:800;cursor:pointer;transition:transform 100ms,box-shadow 100ms,background-color 150ms;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;letter-spacing:0.06em;text-transform:uppercase;width:100%;background:var(--sky);box-shadow:var(--shadow-sm);}
        .btn:hover:not(:disabled){background:var(--sky-dark);transform:translate(-2px,-2px);box-shadow:var(--shadow);}
        .btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--border);}
        .btn:disabled{opacity:0.6;cursor:not-allowed;}
        .recaptcha-wrapper{margin-bottom:16px;display:flex;justify-content:center;}
        .error-message{background:#fee2e2;color:#991b1b;border:2px solid var(--border);padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;margin-bottom:16px;display:none;box-shadow:var(--shadow-xs);}
        .error-message.show{display:block;}
        .success-message{background:#d1fae5;color:#065f46;border:2px solid var(--border);padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;margin-bottom:16px;display:none;box-shadow:var(--shadow-xs);}
        .success-message.show{display:block;}
        .info-box{background:var(--sky-soft);border:2px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:16px;font-size:12px;color:var(--ink);line-height:1.5;font-weight:600;box-shadow:var(--shadow-xs);}
        .info-box i{color:var(--sky-dark);margin-right:6px;}
        @media(max-width:480px){.reset-card{padding:28px 22px;}.reset-header h1{font-size:22px;}}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
    <script src="/pages/secure-api.js"></script>
</head>
<body>

    <div class="reset-container">
        <div class="reset-card">
            <div class="reset-header">
                <h1>Reset Password</h1>
                <p>Masukkan username untuk menerima link reset</p>
            </div>

            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
            </div>

            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i> <span id="successText"></span>
            </div>

            <div class="info-box">
                <i class="fas fa-info-circle"></i> Link reset akan dikirim ke <b>email terdaftar</b>. Link <b>expired dalam 15 menit</b>.
            </div>

            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" placeholder="Masukkan username" class="form-input" autocomplete="username" oninput="validateUsernameInput()">
            </div>

            <div class="recaptcha-wrapper">
                <div class="g-recaptcha" data-sitekey="6LeffrotAAAAAO7SRbl-wJQ8YXzOGNG-t-DW5EGT"></div>
            </div>

            <button class="btn" id="btnReset" onclick="resetPassword()">
                <i class="fas fa-paper-plane"></i> Kirim Link Reset
            </button>

            <div class="reset-footer">
                <p>Sudah ingat password? <a href="/">Login di sini</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/pages/reset-password.js"></script>
</body>
</html>
